name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      branch:
        description: "Branch name to use"
        required: true
        type: string

jobs:
  build:
    runs-on: organization/ops
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ARGON_TOKEN }}

      - name: Build
        run:
          podman build -t go-fiovb .
          podman create --name go-fiovb go-fiovb:latest
          podman cp go-fiovb:/go-fiovb/output/ .
          podman rm go-fiovb
